services:
  - type: web
    name: walka-czarodziejow
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: walka-czarodziejow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
